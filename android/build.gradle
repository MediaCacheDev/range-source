// dev.mediacache:range-source, the Android library: librangesource.so (native/src and the JNI
// glue) and the Java API. The React Native package, react-native-range-source, builds these same
// sources from react-native/android/build.gradle.

buildscript {
    // Only when this directory is built on its own; inside an app, the app's plugin is used.
    if (project == rootProject) {
        repositories {
            google()
            mavenCentral()
        }
        dependencies {
            classpath 'com.android.tools.build:gradle:8.12.0'
        }
    }
}

apply plugin: 'com.android.library'

def safeExtGet(name, fallback) {
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
}

group = 'dev.mediacache'
version = '1.0.0'

android {
    namespace 'dev.mediacache.rangesource'
    compileSdk safeExtGet('compileSdkVersion', 36)
    ndkVersion safeExtGet('ndkVersion', '27.1.12297006')

    defaultConfig {
        minSdk safeExtGet('minSdkVersion', 24)
        consumerProguardFiles 'consumer-rules.pro'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -fexceptions -Os'
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
                // Its own C++ runtime: players reach it through the C table only, and a second
                // libc++_shared.so beside theirs would clash in the app
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

if (project == rootProject) {
    apply from: 'publish.gradle'
}
