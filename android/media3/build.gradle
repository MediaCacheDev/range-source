// dev.mediacache:range-source-media3: reads through an app's Media3 DataSource.Factory as a
// RangeDataSource. Opt-in. Media3 comes from the app, so this artifact pulls in none; it brings
// range-source with it (api), since it can't work without it, even in an app that excluded it.

apply plugin: 'com.android.library'

def safeExtGet(name, fallback) {
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
}

group = 'dev.mediacache'
version = rootProject.version

android {
    namespace 'dev.mediacache.rangesource.media3'
    compileSdk safeExtGet('compileSdkVersion', 36)

    defaultConfig {
        minSdk safeExtGet('minSdkVersion', 24)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    api rootProject
    compileOnly 'androidx.media3:media3-datasource:1.8.0'
}

ext.publishArtifactId = 'range-source-media3'
ext.publishDescription = 'Media3 adapter for range-source, the range source and storage manager for video and other partial content: reads through an app\'s own Media3 DataSource.Factory (OkHttp, Cronet, caches).'
apply from: rootProject.file('publish.gradle')
